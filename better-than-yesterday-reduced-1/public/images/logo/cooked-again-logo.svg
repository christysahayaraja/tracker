<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D5B5"/>
      <stop offset="50%" stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#8C6D37"/>
    </linearGradient>
    <radialGradient id="badgeDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22222E"/>
      <stop offset="70%" stop-color="#121218"/>
      <stop offset="100%" stop-color="#08080C"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="92" fill="url(#badgeDark)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#C9A96E" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- Crossed Kitchen Tools in Background -->
  <!-- Whisk Left to Right -->
  <path d="M50 145 L150 55" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="152" cy="53" r="5" fill="#C9A96E"/>
  <!-- Spatula Right to Left -->
  <path d="M150 145 L50 55" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
  <rect x="42" y="47" width="16" height="12" rx="2" transform="rotate(-45 50 53)" fill="url(#goldGrad)"/>

  <!-- Chef Hat (Toque Blanche) -->
  <!-- Puffs -->
  <path d="M100 42 C85 42 74 54 74 68 C62 70 54 80 54 92 C54 104 62 113 74 114 H126 C138 113 146 104 146 92 C146 80 138 70 126 68 C126 54 115 42 100 42 Z" 
        fill="#FFFFFF" 
        filter="drop-shadow(0px 4px 8px rgba(0,0,0,0.5))"/>
  
  <!-- Hat Creases / Folds -->
  <path d="M84 70 C84 55 92 46 100 46 C108 46 116 55 116 70" stroke="#DDD" stroke-width="2" fill="none"/>
  <path d="M72 85 C70 75 76 65 84 62" stroke="#DDD" stroke-width="2" fill="none"/>
  <path d="M128 85 C130 75 124 65 116 62" stroke="#DDD" stroke-width="2" fill="none"/>

  <!-- Hat Band -->
  <rect x="70" y="112" width="60" height="16" rx="3" fill="url(#goldGrad)" stroke="#6B5121" stroke-width="1"/>
  <!-- Gold Stripes on Band -->
  <line x1="74" y1="117" x2="126" y2="117" stroke="#3D2E14" stroke-width="1.5"/>
  <line x1="74" y1="123" x2="126" y2="123" stroke="#3D2E14" stroke-width="1.5"/>

  <!-- Flame / Heart Spark in Hat Center -->
  <path d="M100 88 C95 80 88 84 88 90 C88 98 100 106 100 106 C100 106 112 98 112 90 C112 84 105 80 100 88 Z" fill="#E5484D"/>

  <!-- Ribbon / Banner across Bottom -->
  <path d="M35 152 L165 152 L155 174 L45 174 Z" fill="#121218" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <text x="100" y="167" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="12" font-weight="bold" fill="#E8D5B5" text-anchor="middle" letter-spacing="2">
    COOKED AGAIN
  </text>
  <text x="100" y="186" font-family="sans-serif" font-size="8" font-weight="600" fill="#C9A96E" text-anchor="middle" letter-spacing="1">
    SINCE CRAVINGS
  </text>
</svg>
